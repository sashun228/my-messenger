<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messenger</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#4CAF50">

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f0f2f5;
}

/* AUTH SCREEN */

#authScreen{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f0f2f5;
}

.auth-box{
    width:340px;
    background:white;
    padding:24px;
    border-radius:16px;
    box-shadow:0 8px 30px rgba(0,0,0,0.08);
    display:flex;
    flex-direction:column;
    gap:12px;
}

.auth-box h2{
    margin:0 0 8px 0;
    text-align:center;
}

.auth-box input{
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:14px;
    width:100%;
    box-sizing:border-box;
}

.auth-box button{
    padding:12px;
    border:none;
    border-radius:10px;
    background:#4CAF50;
    color:white;
    font-size:15px;
    cursor:pointer;
}

.auth-box button:hover{
    background:#43a047;
}

.auth-small{
    text-align:center;
    color:#666;
    font-size:14px;
}

.hidden{
    display:none !important;
}

/* MESSENGER */

#messengerScreen{
    display:flex;
    height:100vh;
}

#users{
    width:260px;
    background:white;
    border-right:1px solid #ddd;
    display:flex;
    flex-direction:column;
}

#account{
    padding:12px;
    margin:0;
}

#sideButtons{
    display:flex;
    flex-direction:column;
    padding:8px;
}

#sideButtons button{
    padding:10px;
    margin:4px 0;
    border:none;
    border-radius:8px;
    background:#4CAF50;
    color:white;
    cursor:pointer;
    font-size:14px;
}

#sideButtons button:hover{
    background:#43a047;
}

#usersTitle{
    padding:0 12px;
    margin:8px 0;
}

#usersList{
    flex:1;
    overflow:auto;
    padding:8px;
}

.user{
    padding:10px;
    border-radius:8px;
    cursor:pointer;
    margin-bottom:4px;
}

.user:hover{
    background:#f2f2f2;
}

.active-user{
    background:#e8f5e9;
}

#chat{
    flex:1;
    display:flex;
    flex-direction:column;
}

#currentChat{
    margin:0;
    padding:12px;
    background:white;
    border-bottom:1px solid #ddd;
}

#typing{
    min-height:18px;
    font-size:12px;
    color:gray;
    padding:4px 12px;
    background:white;
}

#messages{
    flex:1;
    overflow:auto;
    padding:15px;
    display:flex;
    flex-direction:column;
    background:#f7f7f7;
}

.message{
    padding:8px 12px;
    border-radius:12px;
    margin:4px 0;
    max-width:70%;
    word-break:break-word;
}

.me{
    background:#4CAF50;
    color:white;
    align-self:flex-end;
}

.other{
    background:#e4e6eb;
    align-self:flex-start;
}

#sendBox{
    padding:10px;
    border-top:1px solid #ddd;
    background:white;
}

#message{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:14px;
}

.online{ color:green; }
.offline{ color:gray; }

@media (max-width: 700px){
    #messengerScreen{
        flex-direction:column;
    }

    #users{
        width:100%;
        height:220px;
        border-right:none;
        border-bottom:1px solid #ddd;
    }

    .auth-box{
        width:90%;
    }
}
</style>
</head>
<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js")
            .then(() => console.log("SW registered"))
            .catch((err) => console.log("SW error", err));
    });
}
</script>
<body>

<!-- AUTH -->
<div id="authScreen">
    <div class="auth-box">
        <h2>Messenger</h2>
        <div class="auth-small">Вход и регистрация</div>

        <input id="registerName" placeholder="Имя для регистрации">
        <input id="registerEmail" placeholder="Email для регистрации">
        <button onclick="register()">Зарегистрироваться</button>

        <div class="auth-small">или</div>

        <input id="loginCode" placeholder="Введите код">
        <button onclick="login()">Войти</button>
    </div>
</div>

<!-- MESSENGER -->
<div id="messengerScreen" class="hidden">
    <div id="users">
        <h3 id="account">Вы не вошли</h3>

        <div id="sideButtons">
            <button onclick="logout()">Выйти</button>
        </div>

        <h3 id="usersTitle">Пользователи</h3>
        <div id="usersList"></div>
    </div>

    <div id="chat">
        <h3 id="currentChat">Чат не выбран</h3>
        <div id="typing"></div>
        <div id="messages"></div>

        <div id="sendBox">
            <input id="message" placeholder="Сообщение">
        </div>
    </div>
</div>

<script>
let ws = null
let currentChat = null
let myName = null
let typingTimeout = null

function showMessenger(){
    document.getElementById("authScreen").classList.add("hidden")
    document.getElementById("messengerScreen").classList.remove("hidden")
}

function showAuth(){
    document.getElementById("messengerScreen").classList.add("hidden")
    document.getElementById("authScreen").classList.remove("hidden")
}

function resetUsers(){
    document.getElementById("usersList").innerHTML = ""
}

function connect(){
    if(ws){
        try { ws.close() } catch(e) {}
    }

    ws = new WebSocket(
        (location.protocol === "https:" ? "wss://" : "ws://") +
        location.host +
        "/ws"
    )

    ws.onmessage = function(event){
        console.log("SERVER:", event.data)

        if(event.data === "EMAIL_SENT"){
            alert("Код отправлен на почту")
            return
        }

        if(event.data === "EMAIL_ERROR"){
            alert("Не удалось отправить письмо")
            return
        }

        if(event.data === "LOGIN_ERROR"){
            alert("Неверный код входа")
            return
        }

        if(event.data === "REGISTER_ERROR"){
            alert("Ошибка регистрации")
            return
        }

        if(event.data === "USERNAME_EXISTS"){
            alert("Такое имя уже занято")
            return
        }

        if(event.data.startsWith("AUTH_OK:")){
            myName = event.data.replace("AUTH_OK:", "").trim()

            document.getElementById("account").innerText = "Вы вошли как " + myName
            localStorage.setItem("messenger_username", myName)

            showMessenger()
            resetUsers()
            ws.send("GET_USERS")
            return
        }

        if(event.data.startsWith("CHAT_START:")){
            document.getElementById("messages").innerHTML = ""
            return
        }

        if(event.data.startsWith("CHAT_END:")){
            return
        }

        if(event.data.startsWith("USER:")){
            const parts = event.data.split(":")
            const username = parts[1]
            const status = parts[2]

            if(!myName) return
            if(username === myName) return

            let existing = document.querySelector(`[data-username="${username}"]`)

            if(existing){
                existing.innerHTML = `${username} <span class="${status}">●</span>`
                return
            }

            const div = document.createElement("div")
            div.className = "user"
            div.dataset.username = username
            div.innerHTML = `${username} <span class="${status}">●</span>`

            div.onclick = function(){
                currentChat = username
                document.getElementById("currentChat").innerText = "Чат с " + username

                document.querySelectorAll(".user").forEach(el => el.classList.remove("active-user"))
                div.classList.add("active-user")

                if(ws && ws.readyState === WebSocket.OPEN){
                    ws.send("LOAD_CHAT:" + username)
                }
            }

            document.getElementById("usersList").appendChild(div)
            return
        }

        if(event.data.startsWith("MSG:")){
            const parts = event.data.split(":")
            const sender = parts[1]
            const text = parts.slice(2).join(":")

            if(!currentChat) return
            if(sender !== myName && sender !== currentChat) return

            const msg = document.createElement("div")
            msg.className = "message"

            if(sender === myName){
                msg.classList.add("me")
            }else{
                msg.classList.add("other")
            }

            msg.innerText = text
            document.getElementById("messages").appendChild(msg)
            document.getElementById("messages").scrollTop =
                document.getElementById("messages").scrollHeight
            return
        }

        if(event.data.startsWith("TYPING:")){
            const user = event.data.replace("TYPING:", "").trim()

            if(currentChat !== user) return

            document.getElementById("typing").innerText = user + " печатает..."

            clearTimeout(typingTimeout)
            typingTimeout = setTimeout(() => {
                document.getElementById("typing").innerText = ""
            }, 1500)
        }
    }
}

function register(){
    const username = document.getElementById("registerName").value.trim()
    const email = document.getElementById("registerEmail").value.trim()

    if(!username || !email){
        alert("Введите имя и email")
        return
    }

    connect()

    ws.onopen = function(){
        ws.send("register:" + username + ":" + email)
    }
}

function login(){
    const code = document.getElementById("loginCode").value.trim()

    if(!code){
        alert("Введите код")
        return
    }

    localStorage.setItem("messenger_code", code)

    connect()

    ws.onopen = function(){
        ws.send("login:" + code)
    }
}

function logout(){
    localStorage.clear()
    myName = null
    currentChat = null

    if(ws){
        try { ws.close() } catch(e) {}
    }

    showAuth()
    location.reload()
}

function sendMessage(){
    if(!currentChat){
        alert("Выберите пользователя")
        return
    }

    const input = document.getElementById("message")
    const text = input.value.trim()

    if(!text) return

    ws.send(currentChat + ":" + text)
    input.value = ""
}

document.getElementById("message").addEventListener("keypress", function(e){
    if(currentChat && ws && ws.readyState === WebSocket.OPEN){
        ws.send("TYPING:" + currentChat)
    }

    if(e.key === "Enter"){
        sendMessage()
    }
})

window.onload = function(){
    const savedCode = localStorage.getItem("messenger_code")

    if(savedCode){
        connect()

        ws.onopen = function(){
            ws.send("login:" + savedCode)
        }
    }
}
</script>

</body>
</html>
