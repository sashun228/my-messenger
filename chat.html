<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Messenger</title>

<link rel="manifest" href="/manifest.json">

<style>

body{
margin:0;
font-family:Arial;
display:flex;
height:100vh;
background:#f0f2f5;
}

#users{
width:250px;
background:white;
border-right:1px solid #ddd;
display:flex;
flex-direction:column;
}

#usersList{
flex:1;
overflow:auto;
padding:10px;
}

.user{
padding:10px;
cursor:pointer;
border-radius:6px;
}

.user:hover{
background:#f2f2f2;
}

#chat{
flex:1;
display:flex;
flex-direction:column;
}

#messages{
flex:1;
overflow:auto;
padding:15px;
display:flex;
flex-direction:column;
}

.message{
padding:8px 12px;
border-radius:10px;
margin:4px 0;
max-width:70%;
}

.me{
background:#4CAF50;
color:white;
align-self:flex-end;
}

.other{
background:#e4e6eb;
}

#sendBox{
padding:10px;
border-top:1px solid #ddd;
background:white;
}

#message{
width:100%;
padding:10px;
border-radius:6px;
border:1px solid #ccc;
}

.online{color:green}
.offline{color:gray}

#typing{
font-size:12px;
color:gray;
padding-left:10px;
}

</style>

</head>

<body>

<div id="users">

<h3 id="account"></h3>

<button onclick="register()">Зарегистрироваться</button>
<button onclick="login()">Войти</button>

<h3>Пользователи</h3>

<div id="usersList"></div>

</div>


<div id="chat">

<h3 id="currentChat">Чат не выбран</h3>

<div id="typing"></div>

<div id="messages"></div>

<div id="sendBox">
<input id="message" placeholder="Сообщение">
</div>

</div>

<script>

if ("Notification" in window) {
Notification.requestPermission()
}

let ws
let currentChat=null
let myName=null
let typingTimeout

function connect(){

ws=new WebSocket(
(location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws"
)

ws.onmessage=function(event){

if(event.data.startsWith("USER:")){

let parts=event.data.split(":")
let username=parts[1]
let status=parts[2]

if(username===myName)return

let div=document.createElement("div")

div.className="user"

div.innerHTML=username+" <span class='"+status+"'>●</span>"

div.onclick=function(){

currentChat=username

document.getElementById("currentChat").innerText="Чат с "+username

document.getElementById("messages").innerHTML=""

ws.send("LOAD_CHAT:"+username)

}

document.getElementById("usersList").appendChild(div)

return
}


if(event.data.startsWith("MSG:")){

let parts=event.data.split(":")
let sender=parts[1]
let text=parts[2]

let msg=document.createElement("div")

msg.className="message"

if(sender===myName){
msg.classList.add("me")
}else{
msg.classList.add("other")
}

msg.innerText=text

document.getElementById("messages").appendChild(msg)

if(sender!==myName && document.hidden){

if(Notification.permission==="granted"){
new Notification("Новое сообщение от "+sender,{body:text})
}

}

return
}


if(event.data.startsWith("TYPING:")){

let user=event.data.split(":")[1]

document.getElementById("typing").innerText=user+" печатает..."

clearTimeout(typingTimeout)

typingTimeout=setTimeout(()=>{
document.getElementById("typing").innerText=""
},1500)

}

}

}


function register(){

connect()

let username=prompt("Введите имя")

myName=username

ws.onopen=()=>{

ws.send("register:"+username)

setTimeout(()=>ws.send("GET_USERS"),500)

document.getElementById("account").innerText="Вы вошли как "+username

}

}


function login(){

connect()

let code=prompt("Введите код")

myName=localStorage.getItem("messenger_username")

ws.onopen=()=>{

ws.send("login:"+code)

setTimeout(()=>ws.send("GET_USERS"),500)

document.getElementById("account").innerText="Вы вошли как "+myName

}

}


function sendMessage(){

if(!currentChat)return

let input=document.getElementById("message")

ws.send(currentChat+":"+input.value)

input.value=""

}


document.getElementById("message").addEventListener("keypress",function(e){

if(currentChat){
ws.send("TYPING:"+currentChat)
}

if(e.key==="Enter"){
sendMessage()
}

})


window.onload=function(){

let code=localStorage.getItem("messenger_code")
let username=localStorage.getItem("messenger_username")

if(code){

myName=username

connect()

ws.onopen=()=>{

ws.send("login:"+code)

setTimeout(()=>ws.send("GET_USERS"),500)

document.getElementById("account").innerText="Вы вошли как "+username

}

}

}


if("serviceWorker" in navigator){
navigator.serviceWorker.register("/sw.js")
}

</script>

</body>

</html>
